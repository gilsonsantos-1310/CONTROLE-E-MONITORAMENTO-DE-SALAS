function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function formatDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function formatDateBR(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function toMinutes(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function overlaps(aStart,aEnd,bStart,bEnd){
  return toMinutes(aStart) < toMinutes(bEnd) && toMinutes(bStart) < toMinutes(aEnd);
}

/* =========================================================================
   LÓGICA DE DISPONIBILIDADE E CONFLITOS
   ========================================================================= */

function getSlotInfo(roomId, date, period, bookings){
  const overlapping = bookings.filter(b =>
    b.roomId === roomId && b.date === date && b.status !== 'recusado' &&
    overlaps(b.start, b.end, period.start, period.end)
  );
  const approved = overlapping.find(b => b.status === 'aprovado');
  if (approved) return { status:'reservado', bookings:[approved] };
  const pending = overlapping.filter(b => b.status === 'pendente');
  if (pending.length) return { status:'pendente', bookings: pending };
  return { status:'livre', bookings:[] };
}

function hasApprovedConflict(candidate, bookings, excludeId){
  return bookings.find(b =>
    b.id !== excludeId &&
    b.status === 'aprovado' &&
    b.roomId === candidate.roomId &&
    b.date === candidate.date &&
    overlaps(b.start, b.end, candidate.start, candidate.end)
  ) || null;
}

function Toast({ toast }){
  if (!toast) return null;
  const map = {
    success: { bg:'var(--ink)', icon:'✓' },
    error:   { bg:'var(--danger)', icon:'!' },
    info:    { bg:'var(--ink-2)', icon:'i' },
  };
  const s = map[toast.type] || map.info;
  return (
    <div className="fixed top-5 right-5 z-[100] toast-in max-w-sm">
      <div className="rounded-xl shadow-lg px-4 py-3 flex items-start gap-3 text-white" style={{ background:s.bg }}>

        <p className="text-sm leading-snug">{toast.message}</p>

  );
}

/* =========================================================================
   GRADE / TIMETABLE
   ========================================================================= */

function TimetableGrid({ rooms, date, bookings, onCellClick, clickableFree }){
  const groups = useMemo(()=>{
    const out = [];
    PERIODS.forEach(p=>{
      let g = out.find(x=>x.shift===p.shift);
      if(!g){ g = {shift:p.shift, periods:[]}; out.push(g); }
      g.periods.push(p);
    });
    return out;
  },[]);

  if (rooms.length === 0){
    return (
      <div className="bg-white rounded-2xl border p-10 text-center" style={{ borderColor:'var(--border)' }}>
        <p className="font-display font-semibold text-lg mb-1" style={{ color:'var(--ink)' }}>Nenhum espaço encontrado</p>
        <p className="text-sm" style={{ color:'var(--muted)' }}>Ajuste os filtros para ver a disponibilidade de outros espaços.</p>
      </div>
    );
  }

  return (
    <div className="bg-white rounded-2xl border overflow-hidden" style={{ borderColor:'var(--border)' }}>
      <div className="overflow-x-auto">
        <table className="w-full border-collapse text-sm">
          <thead>
            <tr>
              <th className="sticky-col text-left px-4 py-3 font-mono text-xs font-semibold uppercase tracking-wide border-b border-r" style={{ borderColor:'var(--border)', color:'var(--muted)' }}>Horário</th>
              {rooms.map(room=>(
                <th key={room.id} className="px-4 py-3 border-b text-left min-w-[150px]" style={{ borderColor:'var(--border)' }}>
                  <div className="flex flex-col gap-1">
                    <RoomTypeTag type={room.type} />
                    <span className="font-mono text-[11px] font-semibold" style={{ color:'var(--ink)' }}>{room.code}</span>
                    <span className="text-xs" style={{ color:'var(--muted)' }}>{room.name}</span>
                  </div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {groups.map(group=>(
              <Fragment key={group.shift}>
                <tr className="shift-row">
                  <td colSpan={rooms.length+1} className="px-4 py-1.5 text-xs font-display font-semibold tracking-wide">{group.shift.toUpperCase()}</td>
                </tr>
                {group.periods.map(period=>(
                  <tr key={period.id}>
                    <td className="sticky-col px-4 py-2 border-r border-b font-mono text-xs whitespace-nowrap" style={{ borderColor:'var(--border)', color:'var(--muted)' }}>
                      <span className="font-semibold" style={{ color:'var(--ink)' }}>{period.id}ª</span> · {period.start}–{period.end}
                    </td>
                    {rooms.map(room=>{
                      const info = getSlotInfo(room.id, date, period, bookings);
                      const isFreeClickable = info.status === 'livre' && clickableFree;
                      const isOccupiedClickable = info.status !== 'livre';
                      const clickable = isFreeClickable || isOccupiedClickable;
                      const styleMap = {
                        livre:     { background:'#FAFBFD' },
                        pendente:  { background:'var(--pending-bg)' },
                        reservado: { background:'var(--reserved-bg)' },
                      };
                      return (
                        <td key={room.id}
                            onClick={()=> clickable && onCellClick(room, period, info)}
                            className={"grid-cell px-3 py-2 border-b align-top " + (clickable ? "cursor-pointer" : "")}
                            style={{ borderColor:'var(--border)', ...styleMap[info.status] }}>
                          {info.status === 'livre' && (
                            <span className="text-[11px]" style={{ color:'var(--free)' }}>{clickableFree ? '+ Agendar' : '—'}</span>
                          )}
                          {info.status === 'pendente' && (
                            <div>
                              <p className="text-[11px] font-semibold" style={{ color:'var(--pending)' }}>Pendente</p>
                              <p className="text-[11px] truncate max-w-[120px]" style={{ color:'var(--muted)' }}>{info.bookings[0].subject}</p>
                            </div>
                          )}
                          {info.status === 'reservado' && (
                            <div>
                              <p className="text-[11px] font-semibold truncate max-w-[120px]" style={{ color:'var(--reserved)' }}>{info.bookings[0].subject}</p>
                              <p className="text-[11px] font-mono" style={{ color:'var(--muted)' }}>{info.bookings[0].className}</p>
                            </div>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function BookingFormModal({ rooms, defaultValues, onClose, onSubmit }){
  const [form, setForm] = useState({
    roomId: defaultValues.roomId || rooms[0]?.id || '',
    date: defaultValues.date || TODAY,
    start: defaultValues.start || '07:00',
    end: defaultValues.end || '07:50',
    subject: '',
    className: '',
    justification: '',
  });
  const [error, setError] = useState('');

  function update(field, value){ setForm(f=>({ ...f, [field]: value })); }

  function handleSubmit(e){
    e.preventDefault();
    if (!form.subject.trim() || !form.className.trim() || !form.justification.trim()){
      setError('Preencha todos os campos obrigatórios.'); return;
    }
    if (toMinutes(form.end) <= toMinutes(form.start)){
      setError('O horário de término deve ser depois do horário de início.'); return;
    }
    setError('');
    onSubmit(form);
  }

  return (
    <Modal title="Nova solicitação de agendamento" onClose={onClose} wide>
      <form onSubmit={handleSubmit}>
        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Espaço">
            <select className={inputClass} style={inputStyle} value={form.roomId} onChange={e=>update('roomId', e.target.value)}>
              {rooms.map(r=><option key={r.id} value={r.id}>{r.code} — {r.name}</option>)}
            </select>
          </Field>
          <Field label="Data">
            <input type="date" min={TODAY} className={inputClass} style={inputStyle} value={form.date} onChange={e=>update('date', e.target.value)} />
          </Field>
          <Field label="Horário de início">
            <input type="time" className={inputClass} style={inputStyle} value={form.start} onChange={e=>update('start', e.target.value)} />
          </Field>
          <Field label="Horário de término">
            <input type="time" className={inputClass} style={inputStyle} value={form.end} onChange={e=>update('end', e.target.value)} />
          </Field>
          <Field label="Disciplina">
            <input className={inputClass} style={inputStyle} value={form.subject} onChange={e=>update('subject', e.target.value)} placeholder="ex: Biologia" />
          </Field>
          <Field label="Turma">
            <input className={inputClass} style={inputStyle} value={form.className} onChange={e=>update('className', e.target.value)} placeholder="ex: 2ºB" />
          </Field>
        </div>
        <Field label="Justificativa / Recursos necessários" hint="Descreva o objetivo da aula e equipamentos que serão utilizados.">
          <textarea className={inputClass} style={inputStyle} rows="3" value={form.justification} onChange={e=>update('justification', e.target.value)} placeholder="ex: Aula prática com uso dos microscópios e lâminas preparadas." />
        </Field>
        {error && <p className="text-sm mb-4" style={{ color:'var(--danger)' }}>{error}</p>}
        <div className="flex justify-end gap-3 mt-2">
          <SecondaryButton type="button" onClick={onClose}>Cancelar</SecondaryButton>
          <PrimaryButton type="submit">Enviar solicitação</PrimaryButton>
        </div>
      </form>
    </Modal>
  );
}

/* =========================================================================

   ========================================================================= */

function ProfessorView({ currentUser, rooms, bookings, users, addBooking, showToast }){
  const [date, setDate] = useState(TODAY);
  const [tipo, setTipo] = useState('todos');
  const [status, setStatus] = useState('todos');
  const [showForm, setShowForm] = useState(false);
  const [formDefaults, setFormDefaults] = useState({});
  const [cellDetail, setCellDetail] = useState(null);

  const filteredRooms = useMemo(()=>{
    return rooms.filter(r=>{
      if (tipo !== 'todos' && r.type !== tipo) return false;
      if (status !== 'todos'){
        const anyMatch = PERIODS.some(p => getSlotInfo(r.id, date, p, bookings).status === status);
        if (!anyMatch) return false;
      }
      return true;
    });
  },[rooms, tipo, status, date, bookings]);

  const myBookings = useMemo(()=>{
    return bookings.filter(b=>b.professorId===currentUser.id).sort((a,b)=> (a.date+a.start) < (b.date+b.start) ? 1 : -1);
  },[bookings, currentUser.id]);

  const myPending = myBookings.filter(b=>b.status==='pendente').length;
  const myApproved = myBookings.filter(b=>b.status==='aprovado').length;

  function handleCellClick(room, period, info){
    if (info.status === 'livre'){
      setFormDefaults({ roomId: room.id, date, start: period.start, end: period.end });
      setShowForm(true);
    } else {
      setCellDetail({ room, period, info });
    }
  }

  function handleSubmitBooking(form){
    const conflict = hasApprovedConflict(form, bookings, null);
    if (conflict){
      showToast('error', 'Este horário já está reservado e aprovado para este espaço. Escolha outro horário.');
      return;
    }
    const pendingConflict = bookings.find(b => b.status==='pendente' && b.roomId===form.roomId && b.date===form.date && overlaps(b.start,b.end,form.start,form.end));
    addBooking({ ...form, id: uid('bk'), professorId: currentUser.id, status:'pendente', rejectionReason:'' });
    setShowForm(false);
    if (pendingConflict){
      showToast('info', 'Solicitação enviada. Atenção: já existe outra solicitação pendente para esse mesmo horário — a coordenação decidirá qual será aprovada.');
    } else {
      showToast('success', 'Solicitação enviada para aprovação da coordenação.');
    }
  }

  return (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
      <div>
        <h1 className="font-display text-2xl font-bold" style={{ color:'var(--ink)' }}>Painel do Professor</h1>
        <p className="text-sm mt-1" style={{ color:'var(--muted)' }}>Veja a disponibilidade em tempo real e solicite o agendamento de um espaço.</p>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <StatCard label="Espaços disponíveis" value={rooms.length} />
        <StatCard label="Minhas pendentes" value={myPending} accent="var(--pending)" />
        <StatCard label="Minhas aprovadas" value={myApproved} accent="var(--reserved)" />
        <StatCard label="Total de solicitações" value={myBookings.length} />
      </div>

      <FilterBar date={date} setDate={setDate} tipo={tipo} setTipo={setTipo} status={status} setStatus={setStatus} />

      <TimetableGrid rooms={filteredRooms} date={date} bookings={bookings} onCellClick={handleCellClick} clickableFree={true} />

      <div className="flex items-center justify-between pt-2">
        <h2 className="font-display text-xl font-bold" style={{ color:'var(--ink)' }}>Minhas solicitações</h2>
        <PrimaryButton onClick={()=>{ setFormDefaults({ date }); setShowForm(true); }}>+ Nova solicitação</PrimaryButton>
      </div>

      <MyBookingsTable bookings={myBookings} rooms={rooms} />

      {showForm && (
        <BookingFormModal rooms={rooms} defaultValues={formDefaults} onClose={()=>setShowForm(false)} onSubmit={handleSubmitBooking} />
      )}
      {cellDetail && (
        <CellDetailModal cell={cellDetail} users={users} rooms={rooms} onClose={()=>setCellDetail(null)} />
      )}
    </div>
  );
}

            <DangerButton onClick={()=>{ onReject(reason); setShowReject(false); setReason(''); }}>Confirmar recusa</DangerButton>

  const pending = bookings.filter(b=>b.status==='pendente').sort((a,b)=> (a.date+a.start) > (b.date+b.start) ? 1 : -1);
  if (pending.length === 0){

        <p className="text-sm" style={{ color:'var(--muted)' }}>Não há solicitações pendentes de aprovação no momento.</p>
      </div>
    );

  return (
    <div className="space-y-4">
      {pending.map(b=>(
        <ModerationCard
          key={b.id}
          booking={b}
          room={rooms.find(r=>r.id===b.roomId)}
          professorName={users.find(u=>u.id===b.professorId)?.name || '—'}
          onApprove={()=>onApprove(b)}
          onReject={(reason)=>onReject(b, reason)}
        />
      ))}
    </div>
  );
}

function emptyRoomForm(){ return { code:'', name:'', type:'sala', capacity:30, resourcesText:'' }; }

function RoomsManager({ rooms, bookings, addRoom, updateRoom, deleteRoom, showToast }){
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyRoomForm());
  function update(field, value){ setForm(f=>({ ...f, [field]: value })); }

  function openNew(){ setForm(emptyRoomForm()); setEditingId(null); setShowForm(true); }
  function openEdit(room){
    setForm({ code:room.code, name:room.name, type:room.type, capacity:room.capacity, resourcesText:room.resources.join(', ') });
    setEditingId(room.id); setShowForm(true);
  }

  function handleSubmit(e){
    e.preventDefault();
    if (!form.code.trim() || !form.name.trim()){ showToast('error','Preencha código e nome do espaço.'); return; }
    const payload = {
      code: form.code.trim().toUpperCase(),
      name: form.name.trim(),
      type: form.type,
      capacity: Number(form.capacity) || 0,
      resources: form.resourcesText.split(',').map(s=>s.trim()).filter(Boolean),
    };
    if (editingId){ updateRoom(editingId, payload); showToast('success','Espaço atualizado.'); }
    else { addRoom({ id: uid('r'), ...payload }); showToast('success','Espaço cadastrado.'); }
    setShowForm(false);
  }

  function handleDelete(room){
    const hasActive = bookings.some(b => b.roomId===room.id && b.status!=='recusado' && b.date >= TODAY);
    if (hasActive){ showToast('error', `Não é possível remover ${room.name}: há agendamentos ativos vinculados a este espaço.`); return; }
    if (window.confirm(`Remover o espaço "${room.name}"? Esta ação não pode ser desfeita.`)) {
      deleteRoom(room.id);
      showToast('info','Espaço removido.');
    }
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-xl font-bold" style={{ color:'var(--ink)' }}>Salas e Laboratórios</h2>
        <PrimaryButton onClick={openNew}>+ Novo espaço</PrimaryButton>
      </div>
      <div className="bg-white rounded-2xl border overflow-hidden" style={{ borderColor:'var(--border)' }}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left" style={{ background:'var(--bg)' }}>
                {['Código','Nome','Tipo','Capacidade','Recursos',''].map(h=>(
                  <th key={h} className="px-4 py-3 font-semibold text-xs uppercase tracking-wide" style={{ color:'var(--muted)' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rooms.map(r=>(
                <tr key={r.id} className="border-t" style={{ borderColor:'var(--border)' }}>
                  <td className="px-4 py-3 font-mono text-xs font-semibold">{r.code}</td>
                  <td className="px-4 py-3">{r.name}</td>
                  <td className="px-4 py-3"><RoomTypeTag type={r.type} /></td>
                  <td className="px-4 py-3">{r.capacity} lugares</td>
                  <td className="px-4 py-3 text-xs max-w-[220px]" style={{ color:'var(--muted)' }}>{r.resources.join(', ') || '—'}</td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <button onClick={()=>openEdit(r)} className="text-xs font-semibold mr-3 hover:underline" style={{ color:'var(--ink-2)' }}>Editar</button>
                    <button onClick={()=>handleDelete(r)} className="text-xs font-semibold hover:underline" style={{ color:'var(--danger)' }}>Excluir</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {showForm && (
        <Modal title={editingId ? 'Editar espaço' : 'Novo espaço'} onClose={()=>setShowForm(false)} wide>
          <form onSubmit={handleSubmit}>
            <RoomFormFields form={form} update={update} />
            <div className="flex justify-end gap-3 mt-2">
              <SecondaryButton type="button" onClick={()=>setShowForm(false)}>Cancelar</SecondaryButton>
              <PrimaryButton type="submit">{editingId ? 'Salvar alterações' : 'Cadastrar espaço'}</PrimaryButton>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

function emptyUserForm(){ return { name:'', username:'', password:'', role:'professor' }; }

function UsersManager({ users, currentUser, addUser, updateUser, deleteUser, showToast }){
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyUserForm());
  function update(field, value){ setForm(f=>({ ...f, [field]: value })); }

  function openNew(){ setForm(emptyUserForm()); setEditingId(null); setShowForm(true); }
  function openEdit(u){ setForm({ name:u.name, username:u.username, password:u.password, role:u.role }); setEditingId(u.id); setShowForm(true); }

  function handleSubmit(e){
    e.preventDefault();
    if (!form.name.trim() || !form.username.trim() || !form.password.trim()){
      showToast('error','Preencha nome, usuário e senha.'); return;
    }
    const duplicate = users.find(u => u.username === form.username.trim() && u.id !== editingId);
    if (duplicate){ showToast('error','Já existe um usuário com este nome de login.'); return; }
    const payload = { name: form.name.trim(), username: form.username.trim(), password: form.password, role: form.role };
    if (editingId){ updateUser(editingId, payload); showToast('success','Usuário atualizado.'); }
    else { addUser({ id: uid('u'), ...payload }); showToast('success','Usuário cadastrado.'); }
    setShowForm(false);
  }

  function handleDelete(u){
    if (u.id === currentUser.id){ showToast('error','Você não pode remover o próprio usuário.'); return; }
    const admins = users.filter(x=>x.role==='admin');
    if (u.role === 'admin' && admins.length <= 1){ showToast('error','É necessário manter ao menos um coordenador/administrador.'); return; }
    if (window.confirm(`Remover o usuário "${u.name}"?`)) { deleteUser(u.id); showToast('info','Usuário removido.'); }
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-xl font-bold" style={{ color:'var(--ink)' }}>Usuários</h2>
        <PrimaryButton onClick={openNew}>+ Novo usuário</PrimaryButton>
      </div>
      <div className="bg-white rounded-2xl border overflow-hidden" style={{ borderColor:'var(--border)' }}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left" style={{ background:'var(--bg)' }}>
                {['Nome','Usuário','Perfil',''].map(h=>(
                  <th key={h} className="px-4 py-3 font-semibold text-xs uppercase tracking-wide" style={{ color:'var(--muted)' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {users.map(u=>(
                <tr key={u.id} className="border-t" style={{ borderColor:'var(--border)' }}>
                  <td className="px-4 py-3">{u.name}{u.id===currentUser.id && <span className="ml-2 text-xs" style={{color:'var(--muted-2)'}}>(você)</span>}</td>
                  <td className="px-4 py-3 font-mono text-xs">{u.username}</td>
                  <td className="px-4 py-3">
                    <span className="text-xs font-semibold px-2 py-1 rounded-full" style={{ background: u.role==='admin' ? 'var(--reserved-bg)' : '#EEF1F8', color: u.role==='admin' ? 'var(--reserved)' : 'var(--muted)' }}>
                      {u.role === 'admin' ? 'Coordenação' : 'Professor(a)'}
                    </span>
                  </td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <button onClick={()=>openEdit(u)} className="text-xs font-semibold mr-3 hover:underline" style={{ color:'var(--ink-2)' }}>Editar</button>
                    <button onClick={()=>handleDelete(u)} className="text-xs font-semibold hover:underline" style={{ color:'var(--danger)' }}>Excluir</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {showForm && (
        <Modal title={editingId ? 'Editar usuário' : 'Novo usuário'} onClose={()=>setShowForm(false)}>
          <form onSubmit={handleSubmit}>
            <Field label="Nome completo">
              <input className={inputClass} style={inputStyle} value={form.name} onChange={e=>update('name', e.target.value)} />
            </Field>
            <Field label="Usuário (login)">
              <input className={inputClass} style={inputStyle} value={form.username} onChange={e=>update('username', e.target.value)} />
            </Field>
            <Field label="Senha">
              <input className={inputClass} style={inputStyle} value={form.password} onChange={e=>update('password', e.target.value)} />
            </Field>
            <Field label="Perfil">
              <select className={inputClass} style={inputStyle} value={form.role} onChange={e=>update('role', e.target.value)}>
                <option value="professor">Professor(a)</option>
                <option value="admin">Coordenação / Administrador</option>
              </select>
            </Field>
            <div className="flex justify-end gap-3 mt-2">
              <SecondaryButton type="button" onClick={()=>setShowForm(false)}>Cancelar</SecondaryButton>
              <PrimaryButton type="submit">{editingId ? 'Salvar alterações' : 'Cadastrar usuário'}</PrimaryButton>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

/* =========================================================================
   PAINEL ADMIN (COORDENAÇÃO)
   ========================================================================= */

function AdminView({ currentUser, rooms, bookings, users, setBookings, addRoom, updateRoom, deleteRoom, addUser, updateUser, deleteUser, showToast }){
  const [tab, setTab] = useState('visao');
  const [date, setDate] = useState(TODAY);
  const [tipo, setTipo] = useState('todos');
  const [status, setStatus] = useState('todos');
  const [cellDetail, setCellDetail] = useState(null);

  const filteredRooms = useMemo(()=>{
    return rooms.filter(r=>{
      if (tipo !== 'todos' && r.type !== tipo) return false;
      if (status !== 'todos'){
        const anyMatch = PERIODS.some(p => getSlotInfo(r.id, date, p, bookings).status === status);
        if (!anyMatch) return false;
      }
      return true;
    });
  },[rooms, tipo, status, date, bookings]);

  const pendingCount = bookings.filter(b=>b.status==='pendente').length;
  const approvedToday = bookings.filter(b=>b.status==='aprovado' && b.date===TODAY).length;
  const occupancyToday = useMemo(()=>{
    const totalCells = rooms.length * PERIODS.length;
    if (totalCells === 0) return 0;
    let occupied = 0;
    rooms.forEach(r => PERIODS.forEach(p => {
      if (getSlotInfo(r.id, TODAY, p, bookings).status === 'reservado') occupied++;
    }));
    return Math.round((occupied/totalCells)*100);
  },[rooms, bookings]);

  function handleApprove(booking){
    const conflict = hasApprovedConflict(booking, bookings, booking.id);
    if (conflict){
      showToast('error', `Conflito de horário: já existe uma reserva aprovada nesse espaço das ${conflict.start} às ${conflict.end} em ${formatDateBR(conflict.date)}. Recuse uma das solicitações antes de aprovar esta.`);
      return;
    }
    setBookings(prev => prev.map(b => b.id===booking.id ? { ...b, status:'aprovado' } : b));
    showToast('success', 'Solicitação aprovada.');
  }

  function handleReject(booking, reason){
    setBookings(prev => prev.map(b => b.id===booking.id ? { ...b, status:'recusado', rejectionReason: reason || '' } : b));
    showToast('info', 'Solicitação recusada.');
  }

  function handleCellClick(room, period, info){
    if (info.status !== 'livre') setCellDetail({ room, period, info });
  }

  const tabs = [
    { id:'visao', label:'Visão geral' },
    { id:'moderacao', label:`Moderação${pendingCount ? ' (' + pendingCount + ')' : ''}` },
    { id:'salas', label:'Salas & Laboratórios' },
    { id:'usuarios', label:'Usuários' },
  ];

  return (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
      <div>
        <h1 className="font-display text-2xl font-bold" style={{ color:'var(--ink)' }}>Painel da Coordenação</h1>
        <p className="text-sm mt-1" style={{ color:'var(--muted)' }}>Modere solicitações e gerencie espaços e usuários da instituição.</p>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <StatCard label="Espaços cadastrados" value={rooms.length} />
        <StatCard label="Pendentes de aprovação" value={pendingCount} accent="var(--pending)" />
        <StatCard label="Aprovadas hoje" value={approvedToday} accent="var(--reserved)" />
        <StatCard label="Ocupação hoje" value={occupancyToday + '%'} />
      </div>

      <div className="flex gap-2 flex-wrap border-b" style={{ borderColor:'var(--border)' }}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            className={"px-4 py-2.5 text-sm font-semibold rounded-t-lg -mb-px border-b-2 transition focus-ring"}
            style={ tab===t.id ? { borderColor:'var(--ink)', color:'var(--ink)' } : { borderColor:'transparent', color:'var(--muted)' } }>
            {t.label}
          </button>
        ))}
      </div>

      {tab === 'visao' && (
        <div className="space-y-6">
          <FilterBar date={date} setDate={setDate} tipo={tipo} setTipo={setTipo} status={status} setStatus={setStatus} />
          <TimetableGrid rooms={filteredRooms} date={date} bookings={bookings} onCellClick={handleCellClick} clickableFree={false} />
        </div>
      )}

      {tab === 'moderacao' && (
        <ModerationPanel bookings={bookings} rooms={rooms} users={users} onApprove={handleApprove} onReject={handleReject} />
      )}

      {tab === 'salas' && (
        <RoomsManager rooms={rooms} bookings={bookings} addRoom={addRoom} updateRoom={updateRoom} deleteRoom={deleteRoom} showToast={showToast} />
      )}

      {tab === 'usuarios' && (
        <UsersManager users={users} currentUser={currentUser} addUser={addUser} updateUser={updateUser} deleteUser={deleteUser} showToast={showToast} />
      )}

      {cellDetail && (
        <CellDetailModal cell={cellDetail} users={users} rooms={rooms} onClose={()=>setCellDetail(null)} />
      )}
    </div>
  );
}

/* =========================================================================
   APP RAIZ
   ========================================================================= */

function App(){
  const [users, setUsers] = useState(INITIAL_USERS);
  const [rooms, setRooms] = useState(INITIAL_ROOMS);
  const [bookings, setBookings] = useState(INITIAL_BOOKINGS);
  const [currentUser, setCurrentUser] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  function showToast(type, message){
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ type, message });
    toastTimer.current = setTimeout(()=>setToast(null), 4500);
  }

  function addBooking(b){ setBookings(prev=>[...prev, b]); }
  function addRoom(r){ setRooms(prev=>[...prev, r]); }
  function updateRoom(id, payload){ setRooms(prev=>prev.map(r=>r.id===id?{...r,...payload}:r)); }
  function deleteRoom(id){ setRooms(prev=>prev.filter(r=>r.id!==id)); }
  function addUser(u){ setUsers(prev=>[...prev, u]); }
  function updateUser(id, payload){ setUsers(prev=>prev.map(u=>u.id===id?{...u,...payload}:u)); }
  function deleteUser(id){ setUsers(prev=>prev.filter(u=>u.id!==id)); }

  if (!currentUser){
    return (
      <Fragment>
        <LoginScreen users={users} onLogin={setCurrentUser} showToast={showToast} />
        <Toast toast={toast} />
      </Fragment>
    );
  }

  return (
    <div className="min-h-screen">
      <TopBar user={currentUser} onLogout={()=>{ setCurrentUser(null); showToast('info','Sessão encerrada.'); }} />
      {currentUser.role === 'professor' ? (
        <ProfessorView currentUser={currentUser} rooms={rooms} bookings={bookings} users={users} addBooking={addBooking} showToast={showToast} />
      ) : (
        <AdminView currentUser={currentUser} rooms={rooms} bookings={bookings} users={users} setBookings={setBookings}
                   addRoom={addRoom} updateRoom={updateRoom} deleteRoom={deleteRoom}
                   addUser={addUser} updateUser={updateUser} deleteUser={deleteUser} showToast={showToast} />
      )}
      <Toast toast={toast} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
